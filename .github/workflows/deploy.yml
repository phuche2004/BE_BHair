name: CI/CD Pipeline

on:
  push:
    branches:
      # Main CI/CD is temporarily disabled while Android runs the SQLite backend.
      - fullstack  # Only trigger on fullstack branch

jobs:
  build:
    name: Build & Push Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Backend
        run: npm run build

      - name: Build Frontend
        env:
          VITE_API_URL: /api/v1
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          cd web
          npm install
          # Đảm bảo FE dùng relative path /api/v1 thay vì api.bhair.site
          npm run build
          cd ..

      - name: Push to production branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B production
          
          # Lưu tạm thư mục web/dist để không bị xóa mất do nó chưa nằm trong git tracker
          cp -r web/dist ./web_dist_backup
          
          # Xóa sạch sành sanh các thư mục không cần thiết cho Server
          git rm -rf --ignore-unmatch src/ .github/ tsconfig.json mobile/ web/ scripts/ privacy-policy/ nodemon.json mongo_data/ tmp/ .aider* *.md *.png *.sh *.bat atlas_backup/
          
          # CỨU HỘ! Phục hồi lại thư mục views chứa giao diện EJS
          git reset HEAD src/views/
          git checkout -- src/views/
          
          # Khôi phục thư mục web/dist
          mkdir -p web
          mv ./web_dist_backup web/dist
          
          # Bắt buộc thêm thư mục dist, views và web/dist
          git add -f dist/ src/views/ web/dist/
          git commit -m "🚀 Auto-build Artifacts for Production (Fullstack)"
          git push -f origin production

  deploy:
    name: Trigger Android Server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Call Webhook
        run: |
          curl -X POST -H "x-deploy-secret: ${{ secrets.DEPLOY_SECRET }}" ${{ secrets.DEPLOY_URL }}/api/deploy
