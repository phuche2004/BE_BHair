name: Keep BE Alive (Render Free Tier)

on:
  schedule:
    # Chạy mỗi 13 phút để Render không sleep sau 15 phút idle
    - cron: "*/13 * * * *"
  workflow_dispatch: # Cho phép chạy thủ công từ GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BE
        run: |
          echo "Pinging BE at $(date)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://be-bhair.onrender.com/)
          echo "Response: $STATUS"
          [ "$STATUS" -eq 200 ] && echo "BE is alive!" || echo "Warning: status $STATUS"
